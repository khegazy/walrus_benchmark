# @package _global_
auto_resume: True # Automatically resume if default experiment_folder and checkpoint exist
finetune: True # Treat existing path as pretrained model to finetune in new path
folder_override: "experiments/test" # Override the folder name for the experiment - considered "resume" if folder has chpts
checkpoint_override: "experiments/test" # Override search path for a resume checkpoint - considered "resume" if populated
config_override: "" #/global/u2/k/khegazy/projects/pde/walrus/walrus/configs/config_test.yaml # Override the search path for a config file
validation_mode: False
frozen_components: # If resuming, these will be automatically imported from the checkpoint config. "all" means use exact settings.
  - model #
