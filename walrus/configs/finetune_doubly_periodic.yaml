defaults:
  - trainer: globalnorm
  - optimizer: adam
  - lr_scheduler: inv_sqrt_w_sqrt_ramps_longer
  - model: extended_isotropic
  - data: lbm_doubly_periodic
  - experiment: finetune_example
  - server: local
  - distribution: fsdp
  - logger: none
  - checkpoint: defaults
  - finetuning_mods: all
  - _self_
data_workers: 4
name: finetune_doubly_periodic
finetune: True
automatic_setup: True
experiment_dir: /global/u2/k/khegazy/projects/pde/walrus/walrus/experiments

# Override experiment defaults (finetune_example sets "experiments/test")
folder_override: ""
checkpoint_override: ""

# Optimizer — lower LR for finetuning
optimizer:
  lr: 1e-4

# LR scheduler — scaled to 16 epochs (~39% warmup, ~20% cooldown to match authors' 51-epoch ratios)
lr_scheduler:
  warmup_epochs: 6
  cooldown_epochs: 3

# Model — disable regularization during finetuning
model:
  drop_path: 0.0
  input_field_drop: 0.0

# Trainer — finetuning schedule
# 16 epochs × 2000 batches/epoch × batch_size 2 × 8 GPUs = 512K samples (~500K target)
trainer:
  max_epoch: 16
  grad_acc_steps: 1
  clip_gradient: 10
  val_frequency: 2
  rollout_val_frequency: 2
  skip_spectral_metrics: True
  enable_amp: False
  # Use samplewise normalization (no stats.yaml needed for custom data)
  revin:
    _target_: walrus.trainer.normalization_strat.SamplewiseRevNormalization
    _partial_: True
